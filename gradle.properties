org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 8.8 requires a JDK 17+. The toolchain is taken from JAVA_HOME (or from
# Android Studio's bundled JDK when building in the IDE); do NOT pin
# org.gradle.java.home here - a machine-specific path in a committed file
# breaks every other clone. Override it per-machine in
# ~/.gradle/gradle.properties if you need to.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
